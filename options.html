<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Hover Image Zoom — Settings</title>
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        max-width: 520px;
        margin: 32px auto;
        color: #1b1b1b;
      }
      h1 { font-size: 16px; margin-bottom: 4px; }
      h2 { font-size: 13px; margin: 28px 0 4px; color: #333; }
      p.hint { color: #666; font-size: 13px; margin-top: 0; }

      .hotkey-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
      }
      .hotkey-row .desc { font-size: 13px; }
      .hotkey-row .conflict { display: block; font-size: 11px; color: #c0392b; margin-top: 2px; }

      .combo-btn {
        min-width: 150px;
        padding: 6px 10px;
        font-size: 13px;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #f4f4f4;
        border: 1px solid #ccc;
        border-radius: 6px;
        cursor: pointer;
      }
      .combo-btn.recording {
        background: #fff3cd;
        border-color: #e0a800;
        color: #7a5b00;
      }

      label.rate-label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-top: 8px;
      }
      .row { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
      input[type="number"] { width: 80px; padding: 6px 8px; font-size: 14px; }

      button.action {
        padding: 8px 16px;
        font-size: 14px;
        cursor: pointer;
      }
      #status, #hotkeyStatus {
        margin-left: 10px;
        font-size: 13px;
        color: #2a7a2a;
      }
      .buttons-row { margin-top: 14px; display: flex; align-items: center; }
    </style>
  </head>
  <body>
    <h1>Hover Image Zoom</h1>
    <p class="hint">All shortcuts act on whichever image is currently under your mouse cursor.</p>

    <h2>Shortcuts</h2>
    <p class="hint">Click a shortcut, then press the new key combination. Press Esc to cancel.</p>
    <div id="hotkeys"></div>
    <div class="buttons-row">
      <button class="action" id="resetHotkeys">Reset shortcuts to defaults</button>
      <span id="hotkeyStatus"></span>
    </div>

    <h2>Zoom repeat rate</h2>
    <p class="hint">
      How many 0.1x steps happen per second while the continuous zoom-in/out shortcut is held.
    </p>
    <label class="rate-label" for="rate">Steps per second</label>
    <div class="row">
      <input id="rate" type="number" min="1" max="60" step="1" />
      <button class="action" id="saveRate">Save</button>
      <span id="status"></span>
    </div>

    <script src="options.js"></script>
  </body>
</html>
