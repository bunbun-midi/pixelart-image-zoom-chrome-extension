<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        width: 260px;
        margin: 0;
        padding: 14px;
        color: #1b1b1b;
      }
      h1 {
        font-size: 14px;
        margin: 0 0 8px;
      }
      p.hint {
        font-size: 12px;
        color: #666;
        margin: 0 0 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 12px;
      }
      td {
        padding: 4px 0;
        vertical-align: top;
      }
      td.combo {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        white-space: nowrap;
        padding-right: 10px;
        color: #333;
      }
      button {
        margin-top: 12px;
        width: 100%;
        padding: 7px;
        font-size: 12px;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <h1>Hover Image Zoom</h1>
    <p class="hint">Hover an image on any page, then use:</p>
    <table id="shortcuts"></table>
    <button id="openOptions">Change shortcuts…</button>
    <script src="popup.js"></script>
  </body>
</html>
